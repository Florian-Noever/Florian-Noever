name: VS Code Extension Publish

on:
  workflow_call:
    inputs:
      dotnet-project:
        description: .NET project the extension ships, such as a helper it runs. It is published once per entry of dotnet-publish-profiles before the extension is built. Leave empty to skip it
        required: false
        default: ''
        type: string
      dotnet-publish-profiles:
        description: Publish profiles to publish dotnet-project with, one per line
        required: false
        default: ''
        type: string
      dotnet-test-project:
        description: Project, solution or folder to run dotnet test on before packing. Leave empty to skip the .NET tests
        required: false
        default: ''
        type: string
      dotnet-version:
        description: .NET SDK version selector, used when dotnet-project or dotnet-test-project is set
        required: false
        default: "10.0.x"
        type: string
      node-version:
        description: Node.js version selector
        required: false
        default: "24"
        type: string
      check-command:
        description: Command that runs the project's own checks after npm ci, such as linting and unit tests. Leave empty to skip it
        required: false
        default: ''
        type: string
      build-command:
        description: Command that builds what vscode:prepublish does not, run after npm ci. Leave empty if vscode:prepublish builds everything
        required: false
        default: ''
        type: string
      test-command:
        description: Command that runs the extension's tests in VS Code after the build, under a virtual display. Leave empty to skip the tests
        required: false
        default: ''
        type: string
      required-files:
        description: Paths or glob patterns, one per line and relative to the extension root, that must each match a file in the VSIX. Leave empty to skip the check
        required: false
        default: ''
        type: string
      pack-dependencies:
        description: Whether vsce packs the production dependencies from node_modules. Leave false for a bundled extension
        required: false
        default: false
        type: boolean
      vs-marketplace:
        description: Whether the VSIX goes to the Visual Studio Marketplace, published by the app registration azure-client-id names
        required: false
        default: false
        type: boolean
      azure-client-id:
        description: Application (client) id of the Microsoft Entra app registration that publishes to the Visual Studio Marketplace. Defaults to the one all Florian-Noever extensions share
        required: false
        default: aec9c895-5809-48c2-bc4b-4fae5ffa90d2
        type: string
      azure-tenant-id:
        description: Directory (tenant) id of that app registration
        required: false
        default: deee41e6-02c3-420a-8c53-52a2be70c101
        type: string
      open-vsx:
        description: Whether the VSIX goes to Open VSX. Needs the OPEN_VSX_TOKEN secret, and Open VSX must have every extension in extensionDependencies
        required: false
        default: false
        type: boolean
    secrets:
      OPEN_VSX_TOKEN:
        description: Open VSX access token of a member of the publisher's namespace
        required: false

env:
  DOTNET_NOLOGO: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"
  VSCE_VERSION: "4.0.0"
  OVSX_VERSION: "1.2.0"

jobs:
  pack:
    name: Pack
    runs-on: ubuntu-latest

    permissions:
      contents: read

    outputs:
      vsix-path: ${{ steps.pack.outputs.vsix-path }}

    steps:
      - name: Resolve version
        id: version
        uses: Florian-Noever/Florian-Noever/.github/actions/resolve-version@v1
        with:
          tag: ${{ github.event.release.tag_name }}
          allow-prerelease: "false"

      - name: Check publishing settings
        if: ${{ inputs.vs-marketplace || inputs.open-vsx }}
        env:
          VS_MARKETPLACE: ${{ inputs.vs-marketplace }}
          AZURE_CLIENT_ID: ${{ inputs.azure-client-id }}
          AZURE_TENANT_ID: ${{ inputs.azure-tenant-id }}
          OPEN_VSX: ${{ inputs.open-vsx }}
          OPEN_VSX_TOKEN: ${{ secrets.OPEN_VSX_TOKEN }}
        run: |
          failed=0
          if [ "$VS_MARKETPLACE" = "true" ] && { [ -z "$AZURE_CLIENT_ID" ] || [ -z "$AZURE_TENANT_ID" ]; }; then
            echo "::error::vs-marketplace is on but azure-client-id or azure-tenant-id is empty, so publishing to the Visual Studio Marketplace would fail after the release."
            failed=1
          fi
          if [ "$OPEN_VSX" = "true" ] && [ -z "$OPEN_VSX_TOKEN" ]; then
            echo "::error::open-vsx is on but the OPEN_VSX_TOKEN secret is not set, so publishing to Open VSX would fail after the release."
            failed=1
          fi
          exit "$failed"

      - name: Checkout
        uses: actions/checkout@v7

      - name: Check Open VSX dependencies
        if: ${{ inputs.open-vsx }}
        run: |
          failed=0
          namespace="$(jq -r .publisher package.json)"
          if ! curl -fsS -o /dev/null "https://open-vsx.org/api/$namespace"; then
            echo "::error::Open VSX has no namespace $namespace. Create it once with ovsx create-namespace $namespace."
            failed=1
          fi
          for id in $(jq -r '(.extensionDependencies // [])[]' package.json); do
            if ! curl -fsS -o /dev/null "https://open-vsx.org/api/${id%%.*}/${id#*.}"; then
              echo "::error::$id is not on Open VSX, which refuses extensions whose extensionDependencies it cannot resolve."
              failed=1
            fi
          done
          exit "$failed"

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node-version }}
          package-manager-cache: false

      - name: Setup .NET
        if: ${{ inputs.dotnet-project != '' || inputs.dotnet-test-project != '' }}
        uses: Florian-Noever/Florian-Noever/.github/actions/setup-dotnet@v1
        with:
          dotnet-version: ${{ inputs.dotnet-version }}

      - name: Test .NET
        if: ${{ inputs.dotnet-test-project != '' }}
        env:
          TEST_PROJECT: ${{ inputs.dotnet-test-project }}
        run: dotnet test "$TEST_PROJECT" -clp:ForceConsoleColor

      - name: Publish .NET project
        if: ${{ inputs.dotnet-project != '' }}
        uses: Florian-Noever/Florian-Noever/.github/actions/dotnet-publish@v1
        with:
          project-path: ${{ inputs.dotnet-project }}
          publish-profiles: ${{ inputs.dotnet-publish-profiles }}
          version: ${{ steps.version.outputs.value }}

      - name: Pack
        id: pack
        uses: Florian-Noever/Florian-Noever/.github/actions/vsix-pack@v1
        with:
          version: ${{ steps.version.outputs.value }}
          check-command: ${{ inputs.check-command }}
          build-command: ${{ inputs.build-command }}
          test-command: ${{ inputs.test-command }}
          required-files: ${{ inputs.required-files }}
          pack-dependencies: ${{ inputs.pack-dependencies }}
          vsce-version: ${{ env.VSCE_VERSION }}
          output-dir: artifacts

      - name: Report pre-release
        if: ${{ github.event.release.prerelease && (inputs.vs-marketplace || inputs.open-vsx) }}
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: echo "::notice::$TAG is a pre-release, so it goes to the GitHub release only and not to the Visual Studio Marketplace or Open VSX."

      - name: Upload VSIX
        uses: actions/upload-artifact@v7
        with:
          name: vsix
          path: ${{ steps.pack.outputs.vsix-path }}
          if-no-files-found: error

  release:
    name: Upload to release
    needs: pack
    runs-on: ubuntu-latest

    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Download VSIX
        uses: actions/download-artifact@v8
        with:
          name: vsix
          path: artifacts

      - name: Upload to Release
        uses: softprops/action-gh-release@v3
        with:
          fail_on_unmatched_files: true
          files: ${{ needs.pack.outputs.vsix-path }}

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: ${{ needs.pack.outputs.vsix-path }}

  vs-marketplace:
    name: Visual Studio Marketplace
    needs: [pack, release]
    if: ${{ inputs.vs-marketplace && !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    environment: vs-marketplace

    permissions:
      id-token: write

    steps:
      - name: Download VSIX
        uses: actions/download-artifact@v8
        with:
          name: vsix
          path: artifacts

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node-version }}
          package-manager-cache: false

      - name: Install vsce
        run: npm install --global "@vscode/vsce@$VSCE_VERSION"

      - name: Log in to Microsoft Entra ID
        id: login
        uses: azure/login@v3
        with:
          client-id: ${{ inputs.azure-client-id }}
          tenant-id: ${{ inputs.azure-tenant-id }}
          allow-no-subscriptions: true

      - name: Publish
        env:
          VSIX_PATH: ${{ needs.pack.outputs.vsix-path }}
        run: vsce publish --packagePath "$VSIX_PATH" --azure-credential --skip-duplicate

      - name: Report publishing identity
        if: ${{ failure() && steps.login.outcome == 'success' }}
        run: |
          id="$(az rest -u https://app.vssps.visualstudio.com/_apis/profile/profiles/me --resource 499b84ac-1321-427f-aa17-267ca6975798 --query id -o tsv)" || exit 0
          echo "::notice::The Entra app publishes as the Azure DevOps profile $id. If the Visual Studio Marketplace refused it, add that id to the publisher's members as a Contributor, then re-run the failed jobs."

  open-vsx:
    name: Open VSX
    needs: [pack, release]
    if: ${{ inputs.open-vsx && !github.event.release.prerelease }}
    runs-on: ubuntu-latest

    # Without id-token, ovsx uses the token instead of switching to trusted publishing on its own.
    permissions: {}

    steps:
      - name: Download VSIX
        uses: actions/download-artifact@v8
        with:
          name: vsix
          path: artifacts

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node-version }}
          package-manager-cache: false

      - name: Publish
        env:
          OVSX_PAT: ${{ secrets.OPEN_VSX_TOKEN }}
          VSIX_PATH: ${{ needs.pack.outputs.vsix-path }}
        run: npx --yes "ovsx@$OVSX_VERSION" publish "$VSIX_PATH" --skip-duplicate
