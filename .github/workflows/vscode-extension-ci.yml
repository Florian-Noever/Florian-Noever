name: VS Code Extension CI

on:
  workflow_call:
    inputs:
      dotnet-project:
        description: .NET project the extension ships, such as a helper it runs. It is published once per entry of dotnet-publish-profiles before the extension is built. Leave empty to skip it
        required: false
        default: ''
        type: string
      dotnet-publish-profiles:
        description: Publish profiles to publish dotnet-project with, one per line
        required: false
        default: ''
        type: string
      dotnet-test-project:
        description: Project, solution or folder to run dotnet test on. Leave empty to skip the .NET tests
        required: false
        default: ''
        type: string
      dotnet-version:
        description: .NET SDK version selector, used when dotnet-project or dotnet-test-project is set
        required: false
        default: "10.0.x"
        type: string
      node-version:
        description: Node.js version selector
        required: false
        default: "24"
        type: string
      check-command:
        description: Command that runs the project's own checks after npm ci, such as linting and unit tests. Leave empty to skip it
        required: false
        default: ''
        type: string
      build-command:
        description: Command that builds what vscode:prepublish does not, run after npm ci. Leave empty if vscode:prepublish builds everything
        required: false
        default: ''
        type: string
      test-command:
        description: Command that runs the extension's tests in VS Code after the build, under a virtual display. Leave empty to skip the test job
        required: false
        default: ''
        type: string
      required-files:
        description: Paths or glob patterns, one per line and relative to the extension root, that must each match a file in the VSIX. Leave empty to skip the check
        required: false
        default: ''
        type: string
      pack-dependencies:
        description: Whether vsce packs the production dependencies from node_modules. Leave false for a bundled extension
        required: false
        default: false
        type: boolean
      retention-days:
        description: How long to keep the packed preview
        required: false
        default: 14
        type: number

env:
  DOTNET_NOLOGO: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"

jobs:
  check:
    name: Check
    if: ${{ inputs.check-command != '' || inputs.dotnet-test-project != '' }}
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        if: ${{ inputs.dotnet-test-project != '' }}
        uses: Florian-Noever/Florian-Noever/.github/actions/setup-dotnet@v1
        with:
          dotnet-version: ${{ inputs.dotnet-version }}

      - name: Test .NET
        if: ${{ inputs.dotnet-test-project != '' }}
        env:
          TEST_PROJECT: ${{ inputs.dotnet-test-project }}
        run: dotnet test "$TEST_PROJECT" -clp:ForceConsoleColor

      - name: Setup Node.js
        if: ${{ inputs.check-command != '' }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm

      - name: Install dependencies
        if: ${{ inputs.check-command != '' }}
        run: npm ci

      - name: Check
        if: ${{ inputs.check-command != '' }}
        run: ${{ inputs.check-command }}

  test:
    name: Test
    if: ${{ inputs.test-command != '' }}
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm

      - name: Setup .NET
        if: ${{ inputs.dotnet-project != '' }}
        uses: Florian-Noever/Florian-Noever/.github/actions/setup-dotnet@v1
        with:
          dotnet-version: ${{ inputs.dotnet-version }}

      - name: Publish .NET project
        if: ${{ inputs.dotnet-project != '' }}
        uses: Florian-Noever/Florian-Noever/.github/actions/dotnet-publish@v1
        with:
          project-path: ${{ inputs.dotnet-project }}
          publish-profiles: ${{ inputs.dotnet-publish-profiles }}

      - name: Install dependencies
        run: npm ci

      - name: Build
        if: ${{ inputs.build-command != '' }}
        run: ${{ inputs.build-command }}

      - name: Test
        env:
          TEST_COMMAND: ${{ inputs.test-command }}
        run: xvfb-run -a bash -eo pipefail -c "$TEST_COMMAND"

  package:
    name: Package
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm

      - name: Setup .NET
        if: ${{ inputs.dotnet-project != '' }}
        uses: Florian-Noever/Florian-Noever/.github/actions/setup-dotnet@v1
        with:
          dotnet-version: ${{ inputs.dotnet-version }}

      - name: Publish .NET project
        if: ${{ inputs.dotnet-project != '' }}
        uses: Florian-Noever/Florian-Noever/.github/actions/dotnet-publish@v1
        with:
          project-path: ${{ inputs.dotnet-project }}
          publish-profiles: ${{ inputs.dotnet-publish-profiles }}

      - name: Pack
        id: pack
        uses: Florian-Noever/Florian-Noever/.github/actions/vsix-pack@v1
        with:
          build-command: ${{ inputs.build-command }}
          required-files: ${{ inputs.required-files }}
          pack-dependencies: ${{ inputs.pack-dependencies }}
          output-dir: artifacts

      - name: Archive VSIX
        uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.pack.outputs.vsix-path }}
          archive: false
          if-no-files-found: error
          retention-days: ${{ inputs.retention-days }}
