name: Publish .NET Project
description: Publishes a .NET project once per publish profile, such as a helper an extension ships next to its own code

inputs:
  project-path:
    description: Project to publish
    required: true
  publish-profiles:
    description: Publish profiles to publish the project with, one per line. The profiles, or the project, decide where the output goes
    required: true
  version:
    description: Version stamped into the published assemblies, such as a release tag, whose leading v is dropped. Leave empty to keep the project's own version
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Publish
      shell: bash
      env:
        PROJECT_PATH: ${{ inputs.project-path }}
        PUBLISH_PROFILES: ${{ inputs.publish-profiles }}
        VERSION: ${{ inputs.version }}
      run: |
        version="${VERSION#v}"
        published=0
        while IFS= read -r profile; do
          profile="${profile//[[:space:]]/}"
          if [ -z "$profile" ]; then
            continue
          fi

          args=("$PROJECT_PATH" -c Release "-p:PublishProfile=$profile" -p:ContinuousIntegrationBuild=true -clp:ForceConsoleColor)
          if [ -n "$version" ]; then
            args+=("-p:Version=$version")
          fi

          echo "::group::Publish $PROJECT_PATH with $profile"
          dotnet publish "${args[@]}"
          echo "::endgroup::"
          published=$((published + 1))
        done <<< "$PUBLISH_PROFILES"

        if [ "$published" -eq 0 ]; then
          echo "::error::publish-profiles names no publish profile."
          exit 1
        fi
